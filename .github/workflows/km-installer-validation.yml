name: Knight Mod installer validation
on:
  push:
    branches: [knight-mod-1.1b-packaging]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  game:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat
      - uses: microsoft/setup-msbuild@v2
      - name: Build public executable
        shell: cmd
        run: MSBuild.exe fheroes2-vs2019.vcxproj /m /property:Platform=${{ matrix.platform }} /property:Configuration=Release-SDL2
      - name: Compile and verify isolated translations
        run: python script/tools/build_km_languages.py
      - name: Package and check public profile
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'
          New-Item -ItemType Directory -Force package/files/data,package/files/lang | Out-Null
          Copy-Item "build/$arch/Release-SDL2/fheroes2.exe" package/fheroes2KM.exe
          Copy-Item files/data/resurrection.h2d package/files/data/resurrectionKM.h2d
          Copy-Item files/data/training_grounds.png,files/data/build_training_grounds.png package/files/data/
          Copy-Item files/lang/km_*.mo package/files/lang/
          Copy-Item packaging/km/knight_mod.ini.default package/
          Copy-Item LICENSE package/LICENCE
          git rev-parse HEAD | Out-File -Encoding ascii package/KM_SOURCE_COMMIT.txt
          $binary = [IO.File]::ReadAllBytes("$pwd/package/fheroes2KM.exe")
          $pe = [BitConverter]::ToInt32($binary,0x3c)
          $machine = [BitConverter]::ToUInt16($binary,$pe+4)
          $expected = if ($arch -eq 'x86') {332} else {34404}
          if ($machine -ne $expected) {throw 'Wrong executable architecture'}
          $strings = [Text.Encoding]::ASCII.GetString($binary)
          foreach ($marker in @('Knight Mod 1.1b','conscription.mode','training_grounds.show_artwork')) {
            if (-not $strings.Contains($marker)) {throw "Missing mod marker: $marker"}
          }
          if (@(Get-ChildItem package/files/lang/*.mo).Count -ne 23) {throw 'Expected 23 isolated catalogs'}
          if (Test-Path package/fheroes2.cfg) {throw 'Do not overwrite game settings'}
          $name = "Knight-Mod-1.1b-Game-Windows-$arch.zip"
          Compress-Archive -Path package/* -DestinationPath $name
          Get-FileHash $name -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Mod-1.1b-Game-Windows-${{ matrix.platform }}
          path: Knight-Mod-1.1b-Game-Windows-${{ matrix.platform }}.zip
          if-no-files-found: error
  launcher:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test the x86 launcher
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          call packaging\km\launcher\build.cmd
      - name: Build the x64 process probe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cd packaging\km\launcher\build
          echo #include ^<cstdio^> > probe.cpp
          echo int main^(^) { auto* output = std::fopen^("launcher-probe.txt", "wb"^); if ^(!output^) return 1; return std::fclose^(output^); } >> probe.cpp
          cl /nologo /EHsc /MT probe.cpp /Fe:game-x64.exe /link /MACHINE:X64
      - name: Verify the PE files and smoke test on Windows x64
        shell: pwsh
        run: |
          $build = 'packaging/km/launcher/build'
          function Check-PE($Path, $Machine, $Magic) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $Path))
            $offset = [BitConverter]::ToInt32($bytes,0x3c)
            if ([BitConverter]::ToUInt32($bytes,$offset) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes,$offset+4) -ne $Machine -or
                [BitConverter]::ToUInt16($bytes,$offset+24) -ne $Magic) {
              throw "Wrong architecture: $Path"
            }
          }
          Check-PE "$build/KnightModLauncher.exe" 0x14c 0x10b
          Check-PE "$build/game-x64.exe" 0x8664 0x20b
          & packaging/km/launcher/smoke.ps1 -Launcher "$build/KnightModLauncher.exe" -GameProbe "$build/game-x64.exe" -ScreenshotFolder "$build/screenshots"
          Get-FileHash "$build/KnightModLauncher.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Knight-Mod-Launcher-Windows-x86
          path: |
            packaging/km/launcher/build/KnightModLauncher.exe
            packaging/km/launcher/build/screenshots/*.png
          if-no-files-found: error
  zip-uninstall:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run the batch in a disposable fheroes2 folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $batch = Get-Content packaging/km/zip/Uninstall_KM.bat -Raw
          $batch = $batch -replace '\r?\n', "`r`n"
          $root = Join-Path $env:RUNNER_TEMP 'Knight Mod ! et &'
          $game = Join-Path $root 'fheroes2'
          $env:APPDATA = Join-Path $root 'AppData'
          $env:HOME = Join-Path $root 'Home'
          $settings = Join-Path $env:HOME '.fheroes2'
          $otherSettings = Join-Path $env:APPDATA 'fheroes2'
          $script = Join-Path $game 'Uninstall_KM.bat'
          $mod = @(
            'fheroes2KM.exe','KnightModLauncher.exe','Knight Mod/knight_mod.ini.default',
            'Knight Mod/files/data/resurrectionKM.h2d','Knight Mod/files/data/training_grounds.png',
            'Knight Mod/files/data/build_training_grounds.png',
            'Knight Mod/files/lang/km_fr.mo','Knight Mod/files/lang/km_vi.mo',
            'Knight Mod/docs/Readme.txt','Knight Mod/docs/Readme_FR.txt',
            'Knight Mod/docs/LICENCE.txt','Knight Mod/docs/Testing_and_Balance_Guide.pdf',
            'Knight Mod/docs/Guide_de_Test_et_Equilibrage.pdf'
          )
          # km_en.mo is not distributed. Keep it as a sentinel.
          $kept = @(
            'fheroes2.exe','Readme.txt','files/data/resurrection.h2d',
            'files/lang/fr.mo','files/lang/km_fr.mo','files/lang/km_en.mo','docs/Knight Mod/Personal note.txt','Knight Mod/docs/Personal note.txt'
          )
          function Write-Fixture($folder,$name) {
            $file = Join-Path $folder $name
            New-Item -ItemType Directory (Split-Path $file) -Force | Out-Null
            Set-Content -LiteralPath $file -Value $name
          }
          function Install-Fixture {
            foreach ($name in $mod + $kept) { Write-Fixture $game $name }
            foreach ($name in @('knight_mod.ini','knight_mod_launcher.language','kept-profile.ini','save/autosave.sav')) {
              Write-Fixture $settings $name
            }
            Write-Fixture $otherSettings 'knight_mod.ini'
            [IO.File]::WriteAllText($script,$batch,[Text.Encoding]::ASCII)
          }
          function Invoke-Batch($answers,$expected) {
            $inputFile = Join-Path $root 'answers.txt'
            $outputFile = Join-Path $root 'output.txt'
            $errorFile = Join-Path $root 'stderr.txt'
            [IO.File]::WriteAllText($inputFile,$answers,[Text.Encoding]::ASCII)
            $start = @{
              FilePath = $env:ComSpec
              ArgumentList = '/d /c Uninstall_KM.bat'
              WorkingDirectory = $game
              RedirectStandardInput = $inputFile
              RedirectStandardOutput = $outputFile
              RedirectStandardError = $errorFile
              PassThru = $true
            }
            $proc = Start-Process @start
            if (!$proc.WaitForExit(20000)) { Stop-Process -Id $proc.Id -Force; throw 'Uninstaller stalled' }
            Get-Content -LiteralPath $outputFile,$errorFile
            if ($proc.ExitCode -ne $expected) { throw "Uninstaller exit code $($proc.ExitCode), expected $expected" }
          }
          function Assert-Kept($folder,$items) {
            foreach ($name in $items) {
              if ((Get-Content -LiteralPath (Join-Path $folder $name) -Raw).Trim() -ne $name) {
                throw "Modified or removed a preserved file: $name"
              }
            }
          }
          function Assert-Uninstalled {
            foreach ($name in $mod) {
              if (Test-Path -LiteralPath (Join-Path $game $name)) { throw "Mod file left behind: $name" }
            }
            if (Test-Path -LiteralPath $script) { throw 'Batch did not remove itself' }
            Assert-Kept $game $kept
            Assert-Kept $settings @('kept-profile.ini','save/autosave.sav')
            Assert-Kept $otherSettings @('knight_mod.ini')
          }

          Install-Fixture
          Invoke-Batch "N`r`n" 0
          Assert-Kept $game $mod
          if (!(Test-Path -LiteralPath $script)) { throw 'Cancel removed the batch' }

          Invoke-Batch "Y`r`nN`r`n`r`n" 0
          Assert-Uninstalled
          Assert-Kept $settings @('knight_mod.ini','knight_mod_launcher.language')

          Install-Fixture
          Invoke-Batch "Y`r`nY`r`n`r`n" 0
          Assert-Uninstalled
          foreach ($name in @('knight_mod.ini','knight_mod_launcher.language')) {
            if (Test-Path -LiteralPath (Join-Path $settings $name)) { throw "Settings were not removed: $name" }
          }

          Install-Fixture
          Write-Fixture $game 'Knight Mod/uninstall/unins000.exe'
          Invoke-Batch "`r`n" 1
          Assert-Kept $game $mod
          Assert-Kept $game @('Knight Mod/uninstall/unins000.exe')
  installer:
    needs: [game, launcher, zip-uninstall]
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: Knight-Mod-1.1b-Game-Windows-*
          path: input/game
      - uses: actions/download-artifact@v4
        with:
          name: Knight-Mod-Launcher-Windows-x86
          path: input/launcher

      - name: Stage the two architectures and common files
        shell: pwsh
        run: |
          foreach ($arch in @('x86', 'x64')) {
            $name = "Knight-Mod-1.1b-Game-Windows-$arch"
            Expand-Archive "input/game/$name/$name.zip" "input/$arch"
            New-Item -ItemType Directory "payload/$arch" -Force | Out-Null
            Copy-Item "input/$arch/fheroes2KM.exe" "payload/$arch"
          }

          $launcher = @(Get-ChildItem input/launcher -Recurse -Filter KnightModLauncher.exe)
          if ($launcher.Count -ne 1) {
            throw 'Unexpected launcher build'
          }

          New-Item -ItemType Directory -Force 'payload/common/Knight Mod/docs' | Out-Null
          Copy-Item 'packaging/km/installer/docs/*.txt','packaging/km/installer/docs/*.pdf' 'payload/common/Knight Mod/docs/'
          Copy-Item 'input/x86/LICENCE' 'payload/common/Knight Mod/docs/LICENCE.txt'
          Copy-Item 'input/x86/files' 'payload/common/Knight Mod/files' -Recurse
          Copy-Item 'input/x86/knight_mod.ini.default' 'payload/common/Knight Mod/'
          Copy-Item $launcher[0] 'payload/common/KnightModLauncher.exe'
          Copy-Item 'packaging/km/installer/launcher.ico' 'payload/'
          [IO.File]::WriteAllText("$pwd/payload/en.language", "en`n")
          [IO.File]::WriteAllText("$pwd/payload/fr.language", "fr`n")

      - name: Compile the x86 setup with Inno Setup 7.1.1
        shell: pwsh
        run: |
          $compilerSetup = "$env:RUNNER_TEMP/innosetup-7.1.1-x64.exe"
          $compilerFolder = "$env:RUNNER_TEMP/Inno Setup 7"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Unexpected Inno Setup download' }
          $install = Start-Process $compilerSetup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$compilerFolder`"" -Wait -PassThru
          if ($install.ExitCode) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          & "$compilerFolder/ISCC.exe" "/DPayloadDir=$pwd/payload" "/O$pwd/out" packaging/km/installer/knight-mod.iss
          if ($LASTEXITCODE) { throw 'Knight Mod setup compilation failed' }

      - name: Test installation and uninstallation on Windows
        shell: pwsh
        run: ./packaging/km/installer/smoke.ps1 -Installer out/Knight-Mod-Setup.exe -Payload payload

      - name: Build and verify the manual ZIP
        shell: pwsh
        run: python packaging/km/zip/build.py payload out/fheroes2_KM-1.1b_Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Mod-1.1b-Windows
          path: |
            out/Knight-Mod-Setup.exe
            out/fheroes2_KM-1.1b_Windows.zip
          if-no-files-found: error
