name: PTP 1.0b Windows Distribution

on:
  push:
    branches: [ ptp-1.0b-windows ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        platform: [ x86, x64 ]
    name: PTP 1.0b Windows ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      shell: cmd
      run: call script/windows/install_packages.bat
    - name: Install translation tools
      shell: cmd
      run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --noprogressbar gettext-devel make
    - uses: microsoft/setup-msbuild@v2
    - name: Build player executable
      shell: cmd
      run: MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=${{ matrix.platform }} /property:Configuration=Release-SDL2 /property:TaxpayerDiagnostics=false /property:TaxpayerTestBuild=false
    - name: Compile translations
      shell: cmd
      run: |
        set PATH=C:\msys64\usr\bin;%PATH%
        C:\msys64\usr\bin\make.exe -C files/lang -j 2
    - name: Package renamed executable, catalogs and resources
      shell: pwsh
      run: |
        $packageRoot = 'ptp-package'
        New-Item -ItemType Directory -Force "$packageRoot/files/lang" | Out-Null
        Copy-Item 'build/${{ matrix.platform }}/Release-SDL2/fheroes2.exe' "$packageRoot/fheroes2TP${{ matrix.platform }}.exe"
        Get-ChildItem 'files/lang/*.mo' | ForEach-Object {
          Copy-Item $_.FullName "$packageRoot/files/lang/$($_.BaseName)_TP.mo"
        }
        New-Item -ItemType Directory -Force "$packageRoot/files/data" | Out-Null
        Copy-Item 'files/data/resurrection.h2d' "$packageRoot/files/data/resurrection_TP.h2d"
        Push-Location $packageRoot
        7z.exe a -tzip '../PTP-1.0b-Windows-${{ matrix.platform }}.zip' './*'
        if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
        Pop-Location
    - name: Verify architecture, catalogs and non-overwriting package
      shell: cmd
      run: python tests/verify_ptp_package.py PTP-1.0b-Windows-${{ matrix.platform }}.zip ${{ matrix.platform }}
    - uses: actions/upload-artifact@v4
      with:
        name: PTP-1.0b-Windows-${{ matrix.platform }}
        path: PTP-1.0b-Windows-${{ matrix.platform }}.zip
        if-no-files-found: error

  bundle:
    needs: windows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: PTP-1.0b-Windows-*
        path: packages
        merge-multiple: true
    - name: Assemble distribution
      run: |
        python3 - <<'PYTHON'
        from pathlib import Path
        import zipfile
        with zipfile.ZipFile('PTP 1.0b.zip', 'w', zipfile.ZIP_STORED) as z:
            z.write('docs/README_PTP_1.0b.txt', 'Readme.txt')
            z.write('LICENSE', 'LICENCE')
            z.write('script/windows/uninstalltp.bat', 'uninstalltp.bat')
            for arch in ('x86', 'x64'):
                name = f'PTP-1.0b-Windows-{arch}.zip'
                z.write(Path('packages') / name, name)
        PYTHON
    - uses: actions/upload-artifact@v4
      with:
        name: PTP-1.0b-complete
        path: PTP 1.0b.zip
        if-no-files-found: error
