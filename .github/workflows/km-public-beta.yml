name: Knight Mod 1.1b Game
on:
  push:
    branches: ['knight-mod-1.1b-public']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat
      - uses: microsoft/setup-msbuild@v2
      - name: Build public executable
        shell: cmd
        run: MSBuild.exe fheroes2-vs2019.vcxproj /m /property:Platform=${{ matrix.platform }} /property:Configuration=Release-SDL2
      - name: Compile and verify isolated translations
        run: python script/tools/build_km_languages.py
      - name: Package and check public profile
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'
          New-Item -ItemType Directory -Force package/files/data,package/files/lang | Out-Null
          Copy-Item "build/$arch/Release-SDL2/fheroes2.exe" package/fheroes2KM.exe
          Copy-Item files/data/resurrection.h2d package/files/data/resurrectionKM.h2d
          Copy-Item files/data/training_grounds.png,files/data/build_training_grounds.png package/files/data/
          Copy-Item files/lang/km_*.mo package/files/lang/
          Copy-Item packaging/km/knight_mod.ini.default package/
          Copy-Item LICENSE package/LICENCE
          git rev-parse HEAD | Out-File -Encoding ascii package/KM_SOURCE_COMMIT.txt
          $binary = [IO.File]::ReadAllBytes("$pwd/package/fheroes2KM.exe")
          $pe = [BitConverter]::ToInt32($binary,0x3c)
          $machine = [BitConverter]::ToUInt16($binary,$pe+4)
          $expected = if ($arch -eq 'x86') {332} else {34404}
          if ($machine -ne $expected) {throw 'Wrong executable architecture'}
          $strings = [Text.Encoding]::ASCII.GetString($binary)
          foreach ($marker in @('Knight Mod 1.1b','conscription.mode','training_grounds.show_artwork')) {
            if (-not $strings.Contains($marker)) {throw "Missing mod marker: $marker"}
          }
          if (@(Get-ChildItem package/files/lang/*.mo).Count -ne 23) {throw 'Expected 23 isolated catalogs'}
          if (Test-Path package/fheroes2.cfg) {throw 'Do not overwrite game settings'}
          $name = "Knight-Mod-1.1b-Game-Windows-$arch.zip"
          Compress-Archive -Path package/* -DestinationPath $name
          Get-FileHash $name -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Mod-1.1b-Game-Windows-${{ matrix.platform }}
          path: Knight-Mod-1.1b-Game-Windows-${{ matrix.platform }}.zip
          if-no-files-found: error
