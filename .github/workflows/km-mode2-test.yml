name: Knight Mod Mode 2 Test
on:
  push:
    branches: ['knight-mode2-x86-test']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: cmd
        run: script\windows\install_packages.bat
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows x86 test executable
        shell: cmd
        run: MSBuild.exe fheroes2-vs2019.vcxproj /m /property:Platform=x86 /property:Configuration=Release-SDL2 /property:KnightMode2TestBuild=true /property:KnightPublicBuild=false /property:KnightReleaseBuild=true /property:KnightObserverBuild=false /property:TaxpayerDiagnostics=true /property:TaxpayerTestBuild=false
      - name: Compile and verify isolated translations
        run: python script/tools/build_km_languages.py
      - name: Package and verify x86 test profile
        shell: pwsh
        run: |
          $arch = 'x86'
          New-Item -ItemType Directory -Force package/files/data,package/files/lang | Out-Null
          Copy-Item "build/$arch/Release-SDL2/fheroes2.exe" package/fheroes2KM.exe
          Copy-Item files/data/resurrection.h2d package/files/data/resurrectionKM.h2d
          Copy-Item files/data/training_grounds.png,files/data/build_training_grounds.png package/files/data/
          Copy-Item files/lang/km_*.mo package/files/lang/
          Copy-Item packaging/km/knight_mod.ini.default,packaging/km/Uninstall_KM.bat package/
          Copy-Item packaging/km/Mode2_Test_Readme.txt package/Readme_Mode2_Test.txt
          Copy-Item LICENSE package/LICENCE
          git rev-parse HEAD | Out-File -Encoding ascii package/KM_SOURCE_COMMIT.txt
          $binary = [IO.File]::ReadAllBytes("$pwd/package/fheroes2KM.exe")
          $pe = [BitConverter]::ToInt32($binary,0x3c)
          $machine = [BitConverter]::ToUInt16($binary,$pe+4)
          if ($machine -ne 332) {throw 'Wrong executable architecture'}
          $strings = [Text.Encoding]::ASCII.GetString($binary)
          foreach ($marker in @('conscription.mode','Training order for tomorrow','CONSCRIPTION_ORDER_AI','CONSCRIPTION_ORDER_EXECUTION','KNIGHT_ROLE_REVIEW','POPULATION_SUPPLY_PLAN','knight diagnostics')) {
            if (-not $strings.Contains($marker)) {throw "Missing test feature: $marker"}
          }
          if (@(Get-ChildItem package/files/lang/*.mo).Count -ne 23) {throw 'Expected 23 isolated catalogs'}
          if (Test-Path package/fheroes2.cfg) {throw 'Do not overwrite game settings'}
          $name = "Knight-Mod-Mode2-Test-Windows-$arch.zip"
          Compress-Archive -Path package/* -DestinationPath $name
          Get-FileHash $name -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Mod-Mode2-Test-Windows-x86
          path: Knight-Mod-Mode2-Test-Windows-x86.zip
          if-no-files-found: error
