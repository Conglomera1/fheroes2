# Restart fheroes2 after changing these settings.

# --------------------------------------------------
# Taxpayer
# --------------------------------------------------

# Daily gold income per eligible Peasant.
# Default: 2. Set to 0 to disable taxation.
taxpayer.gold_per_peasant_per_day = 2

# Maximum taxable Peasants per Farm. 0 = unlimited.
taxpayer.max_taxable_peasants_per_farm = 0

# --------------------------------------------------
# Conscription
# --------------------------------------------------

# Conscription mode: 0 = disabled, 1 = fixed daily quotas, 2 = orders per town.
conscription.mode = 2

# Gold per garrison Peasant, including failures. Hut conscripts also pay the normal Peasant price.
conscription.gold_per_peasant = 50

# Mode 1: Daily conscription limit per town. Odd days of the week: 1, 3, 5, 7. Even days: 2, 4, 6.
conscription.odd_day_limit = 2
conscription.even_day_limit = 3

# Mode 2: increase per tier as a fraction of the base fee. 1.0 = the same amount; 0 = flat pricing.
# If the base fee is zero, this is an increment in gold.
conscription.gold_increment = 1.0

# Mode 2: multiply each successive increment by this factor. Minimum 1.0.
conscription.gold_increment_multiplier = 1.0

# Mode 2: number of Peasants per price tier. Minimum 1.
conscription.gold_increment_step = 1

# Mode 2: 0 = individual price per rank, 1 = last rank's price for the entire order.
conscription.uniform_batch_price = 0

# Proportion of conscripted Peasants who complete their training.
# 1.0 = all, 0.9 = 90%. Failed conscripts are lost and still paid for.
conscription.peasant_success_ratio = 1.0

# Troops per full cycle of successful training. Each town keeps its own progress.
conscription.archers = 8
conscription.pikemen = 5
conscription.swordsmen = 4

# Farm to Training Grounds
training_grounds.gold = 1750
training_grounds.wood = 10
training_grounds.ore = 5

# Training Grounds back to Farm
farm_reconversion.gold = 1250
farm_reconversion.wood = 0
farm_reconversion.ore = 0

# Training Grounds requirements
# The Farm, Archery Range, Blacksmith and Armory are always required.

# Command. 0 = no, 1 = yes
training_grounds.require_captains_quarters = 1

# Infantry upgrades. 0 = no, 1 = yes
training_grounds.require_upgraded_archery_range = 0
training_grounds.require_upgraded_blacksmith = 0
training_grounds.require_upgraded_armory = 0

# Cavalry and Paladins. 0 = no, 1 = yes (base or upgraded), 2 = upgraded only
training_grounds.require_jousting_arena = 0
training_grounds.require_cathedral = 0

# Castle defenses. 0 = no, 1 = yes
training_grounds.require_moat = 0
training_grounds.require_left_turret = 0
training_grounds.require_right_turret = 0
training_grounds.require_fortifications = 0

# Non-military buildings

# Minimum Mage Guild level required: 1 to 5. Set to 0 to disable.
training_grounds.require_mage_guild = 0

# Other buildings. 0 = no, 1 = yes
training_grounds.require_well = 0
training_grounds.require_tavern = 0
training_grounds.require_statue = 0
training_grounds.require_thieves_guild = 0
training_grounds.require_marketplace = 0

# Miscellaneous
training_grounds.show_artwork = 1
